    <section class="card">
      <h2>Purpose</h2>
      <p>Keep a local ledger of commands and exit codes as JSONL.</p>

      <pre><code>npm install -g runledger</code></pre>
      <h2>Usage</h2>
      <pre><code>runledger record "npm test" 0
runledger list</code></pre>
